name: CI - Commit

on:
  push:
    branches:
      - '**'

jobs:
  build-and-test:
    name: Build, Lint e Testes (Push)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar a aplicação (smoke test)
        run: |
          node index.js &
          sleep 2
          curl -f http://localhost:8080/api/filmes || exit 1
          kill %1

  lint:
    name: Verificação de Estilo (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

  coverage:
    name: Cobertura de Testes (≥90%)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com cobertura
        run: npm test

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-push
          path: coverage/

  docker-build:
    name: Construção da Imagem Docker
    runs-on: ubuntu-latest
    needs: [build-and-test, lint] 

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da Imagem Docker (Apenas Construção)
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/api-filmes:latest .

  docker-publish:
    name: Publicação da Imagem no DockerHub
    runs-on: ubuntu-latest
    needs: docker-build 
    if: github.ref == 'refs/heads/master' 

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push para o DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/api-filmes:latest
            ${{ secrets.DOCKER_USERNAME }}/api-filmes:${{ github.sha }}